name: poll fares
on:
  schedule:
    - cron: '0 16 * * *'   # once a day, 09:00 Pacific (50 routes = ~1,500 calls/mo)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node poll.mjs
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      - run: |
          git config user.name  "fare bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "fares ${{ github.run_number }}"
          git push
